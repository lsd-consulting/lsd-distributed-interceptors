# This workflow will build a Java project with Gradle on push and pull requests.
# It does not release: releases are manual or scheduled, see release.yml.
# For more information see:
#  https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle
#  https://github.com/marketplace/actions/action-for-semantic-release

name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    uses: lsd-consulting/shared-workflows/.github/workflows/build.yml@main
    with:
      operating-system: ubuntu-22.04
      java-version: '17'
      codecov: true
      codecov-path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
      artifact-path: '**/build/reports'
    secrets: inherit
